<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tableau de bord - Statistiques</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <style>
      .card-stats {
        border-radius: 20px;
        transition: transform 0.3s ease;
      }

      .card-stats:hover {
        transform: translateY(-5px);
      }

      .icon-circle {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
      }

      .stats-number {
        font-size: 2.5rem;
        font-weight: bold;
      }
    </style>
  </head>

  <body class="bg-light">
    <div class="container mt-5">
      <div class="row g-4">
        <!-- Cadran 1 : Nombre d'agents -->
        <div class="col-12 col-md-4">
          <div class="card card-stats shadow-sm p-4 text-center">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h6 class="text-muted mb-2">NOMBRE D'AGENTS</h6>
                <h2 class="stats-number mb-0">1,248</h2>
                <small class="text-success">+12 ce mois</small>
              </div>
              <div class="icon-circle bg-primary bg-opacity-10 text-primary">
                <i class="bi bi-people-fill"></i>
              </div>
            </div>
          </div>
        </div>

        <!-- Cadran 2 : Nombres de femmes -->
        <div class="col-12 col-md-4">
          <div class="card card-stats shadow-sm p-4 text-center">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h6 class="text-muted mb-2">NOMBRES DE FEMMES</h6>
                <h2 class="stats-number mb-0">587</h2>
                <small class="text-success">47% des agents</small>
              </div>
              <div class="icon-circle bg-danger bg-opacity-10 text-danger">
                <i class="bi bi-gender-female"></i>
              </div>
            </div>
          </div>
        </div>

        <!-- Cadran 3 : Nombres de femmes avec des icônes -->
        <div class="col-12 col-md-4">
          <div class="card card-stats shadow-sm p-4 text-center">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h6 class="text-muted mb-2">FEMMES (ENCADRÉES)</h6>
                <h2 class="stats-number mb-0">234</h2>
                <small class="text-info">+8 cette semaine</small>
              </div>
              <div class="icon-circle bg-success bg-opacity-10 text-success">
                <i class="bi bi-gender-male"></i>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
